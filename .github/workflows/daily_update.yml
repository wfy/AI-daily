name: Daily AI Report Auto Update

on:
  schedule:
    # Runs at 23:30 UTC every day (07:30 AM Beijing Time UTC+8)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Fetch AI News & Update Webpage
        run: |
          python generate_report.py

      - name: Commit and Push Updated Report
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update AI Daily Report [$(date +'%Y-%m-%d')]" && git pull --rebase origin main && git push) || exit 0
