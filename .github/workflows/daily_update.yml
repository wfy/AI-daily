name: Daily AI Report Auto Update

on:
  schedule:
    # 北京时间每天 07:30 (UTC 23:30) 运行
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Fetch AI News & Update Webpage
        run: |
          if [ -f "generate_report.py" ]; then
            python generate_report.py
          elif [ -f "github_ai_daily_site/generate_report.py" ]; then
            python github_ai_daily_site/generate_report.py
          else
            echo "Error: generate_report.py not found in repository."
            exit 1
          fi

      - name: Commit and Push Updated Report
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update AI Daily Report [$(date +'%Y-%m-%d')]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
